<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">SupportBuddy Lab (dark)</title>
  <desc id="desc">A support chat bubble carrying a connectivity ping pulse and signal waves, linked to three capability nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5DFC"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3B82F6" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 800 54px "Segoe UI", "Inter", system-ui, -apple-system, sans-serif; fill: #F5F7FF; letter-spacing: -1.2px; }
      .accent { fill: url(#bg); }
      .sub { font: 600 17px "Segoe UI", "Inter", system-ui, -apple-system, sans-serif; fill: #A9B4D6; letter-spacing: 2.4px; }
      .chip { fill: #1E1B4B; stroke: #4338CA; }
      .chip-text { font: 700 12px "Cascadia Code", "Consolas", ui-monospace, monospace; fill: #C7D2FE; letter-spacing: 0.6px; }
    </style>
  </defs>

  <!-- Icon -->
  <g transform="translate(18 18)" filter="url(#shadow)">
    <rect width="144" height="144" rx="36" fill="url(#bg)"/>
    <rect x="1.5" y="1.5" width="141" height="141" rx="34.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>

    <!-- Signal waves -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="5">
      <path d="M96 32 a18 18 0 0 1 18 18" stroke-opacity="0.95"/>
      <path d="M96 20 a30 30 0 0 1 30 30" stroke-opacity="0.55"/>
    </g>
    <circle cx="96" cy="50" r="5" fill="#FFFFFF"/>

    <!-- Chat bubble -->
    <path d="M30 52 h50 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-28 l-14 13 v-13 h-8 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z"
          fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Ping pulse -->
    <polyline points="26,80 40,80 47,68 56,94 64,72 70,80 86,80" fill="none" stroke="url(#pulse)"
              stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Capability nodes (tools / MCP) -->
    <g stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5">
      <line x1="108" y1="88" x2="122" y2="76"/>
      <line x1="108" y1="88" x2="124" y2="102"/>
      <line x1="108" y1="88" x2="112" y2="118"/>
    </g>
    <circle cx="108" cy="88" r="7" fill="#FFFFFF"/>
    <circle cx="122" cy="76" r="5" fill="#A7F3D0"/>
    <circle cx="124" cy="102" r="5" fill="#C4B5FD"/>
    <circle cx="112" cy="118" r="5" fill="#BAE6FD"/>
  </g>

  <!-- Wordmark -->
  <text x="190" y="88" class="title">Support<tspan class="accent">Buddy</tspan></text>
  <text x="192" y="120" class="sub">CONNECTIVITY AGENT LAB</text>

  <!-- Tech chips -->
  <g transform="translate(192 136)">
    <rect class="chip" width="148" height="26" rx="13" stroke-width="1.5"/>
    <text class="chip-text" x="74" y="17.5" text-anchor="middle">MICROSOFT FOUNDRY</text>
    <rect class="chip" x="158" width="134" height="26" rx="13" stroke-width="1.5"/>
    <text class="chip-text" x="225" y="17.5" text-anchor="middle">AGENT FRAMEWORK</text>
    <rect class="chip" x="302" width="56" height="26" rx="13" stroke-width="1.5"/>
    <text class="chip-text" x="330" y="17.5" text-anchor="middle">MCP</text>
  </g>
</svg>
