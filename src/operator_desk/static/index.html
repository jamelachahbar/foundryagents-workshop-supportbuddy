<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SupportBuddy - Operator desk</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/desk.css">
</head>
<body>
  <header>
    <img src="/icon.svg" alt="" width="32" height="32">
    <h1>SupportBuddy <span>Operator desk</span></h1>
    <label class="advisor">Advisor <input id="advisor" maxlength="60" value="Advisor Lea"></label>
  </header>
  <p class="banner">Training lab: synthetic cases and data only. Not a POST system.</p>
  <main>
    <section class="queue">
      <h2>Handover queue</h2>
      <ul id="cases"></ul>
      <p id="empty" class="muted">No handovers yet. Ask the agent about CUST-1004 or CUST-1005.</p>
      <h2>Approved actions</h2>
      <ul id="actions"></ul>
    </section>
    <section class="detail" id="detail">
      <p class="muted">Select a case to see what the agent collected.</p>
    </section>
  </main>
  <template id="case-detail">
    <h2><span data-field="handover_id"></span> <span class="pill" data-field="status"></span></h2>
    <dl>
      <dt>Customer</dt><dd data-field="customer_id"></dd>
      <dt>Language</dt><dd data-field="customer_language"></dd>
      <dt>Preferred contact</dt><dd data-field="preferred_contact_channel"></dd>
      <dt>Received</dt><dd data-field="created_at"></dd>
      <dt>Advisor</dt><dd data-field="advisor"></dd>
    </dl>
    <h3>Reported problem</h3><p data-field="reported_problem"></p>
    <h3>Evidence collected by the agent</h3><ul data-list="evidence"></ul>
    <h3>Capabilities checked</h3><p data-field="capabilities_checked"></p>
    <h3>What the agent could not determine</h3><p data-field="unresolved_issue"></p>
    <h3>Recommended next investigation</h3><p data-field="recommended_next_investigation"></p>
    <div class="actions">
      <button type="button" data-action="take">Take case</button>
      <textarea maxlength="1000" placeholder="Message to the customer (the agent will relay it)"></textarea>
      <button type="button" data-action="resolve">Send reply and resolve</button>
      <p class="error" role="alert"></p>
    </div>
  </template>
  <script src="/desk.js"></script>
</body>
</html>
