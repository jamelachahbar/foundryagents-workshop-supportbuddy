<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SupportBuddy - Customer chat</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/centre.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/icon.svg" alt="" width="32" height="32">
      <div>
        <h1>SupportBuddy <span>Customer chat</span></h1>
        <small>Training lab: synthetic customers and systems only.</small>
      </div>
    </div>
    <span id="mode" class="pill"></span>
    <button id="traces" class="ghost" type="button" hidden>Traces</button>
    <button id="new" class="ghost" type="button" hidden>New conversation</button>
  </header>
  <main class="chat">
    <section id="start" class="welcome" hidden>
      <img src="/icon.svg" alt="">
      <h2>Hi, I'm SupportBuddy</h2>
      <p class="muted" id="start-help"></p>
      <label id="signin" hidden>Signed in as
        <select id="customer"></select>
      </label>
      <div id="suggestions" class="suggestions" aria-label="Suggested messages"></div>
      <button id="begin" type="button">Start chatting</button>
      <p class="error" id="start-error" role="alert"></p>
    </section>
    <ul id="messages" class="messages" aria-live="polite" hidden></ul>
    <div class="dock" id="dock" hidden>
      <p id="typing" class="typing"></p>
      <form id="composer" class="composer">
        <textarea id="text" rows="1" maxlength="2000" placeholder="Write your message" aria-label="Message"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <p class="error" id="error" role="alert"></p>
      <p class="hint" id="hint">Enter to send, Shift+Enter for a new line. You can ask for a person at any time.</p>
      <button id="restart" class="secondary" type="button" hidden>Start a new conversation</button>
    </div>
  </main>
  <script src="/common.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
